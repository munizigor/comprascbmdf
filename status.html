<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de demandas - Central de Compras CBMDF</title>
  <link rel="stylesheet" href="src/css/status.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">CB</div>
        <div class="brand-title">
          <strong>Central de Compras CBMDF</strong>
          <span>Aquisições e Serviços</span>
        </div>
      </a>
      <div class="actions">
        <a class="btn btn-secondary" href="index.html" data-profiles="solicitante">Início</a>
        <a class="btn btn-secondary" href="acompanhe.html" data-profiles="solicitante">Meus pedidos</a>
        <a class="btn btn-secondary" href="governanca.html" data-profiles="gestor compras">Governança</a>
        <a class="btn btn-secondary" href="contratacoes.html" data-profiles="compras">Contratações</a>
        <a class="btn btn-secondary" href="planejamento.html" data-profiles="compras">Planejamento</a>
        <a class="btn btn-secondary" href="orcamento-geral.html" data-profiles="gestor compras">Orçamento</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Gestão de demandas</h1>
        <!-- <p>Veja o andamento de cada solicitação por usuário e atualize o status quando necessário.</p> -->
      </div>
    </section>

    <section class="panel">
      <h2>Filtros</h2>
      <div class="filter-row">
        <div class="input-group">
          <label for="searchBox">Buscar</label>
          <input id="searchBox" type="text" placeholder="Pesquisar por usuário, setor, observações, item..." oninput="applyFilters()">
        </div>
        <div class="input-group">
          <label for="userFilter">Usuário</label>
          <select id="userFilter" onchange="applyFilters()">
            <option value="all">Todos os usuários</option>
          </select>
        </div>
        <div class="input-group">
          <label for="statusFilter">Status</label>
          <select id="statusFilter" onchange="applyFilters()">
            <option value="all">Todos os status</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel stats-panel">
      <h2>Resumo</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span>Pedidos no filtro</span>
          <strong id="ordersCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Pedidos arquivados</span>
          <strong id="pendingCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Pedidos entregues</span>
          <strong id="completedCount">0</strong>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Pedidos</h2>
      <div id="ordersContainer"></div>
    </section>
  </main>

  <script src="src/js/cbmdf_orders_seed.js"></script>
  <script src="src/js/status-pipeline.js"></script>
  <script src="src/js/core.js"></script>
  <script src="src/js/users.js"></script>
  <script src="src/js/nav.js"></script>
  <script src="src/js/emptystate.js"></script>
  <script src="src/js/audit.js"></script>
  <script src="src/js/status.js"></script>
</body>
</html>
