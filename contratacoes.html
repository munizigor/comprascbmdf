        <div class="input-group">
          <label for="classFilter">Classe</label>
          <select id="classFilter" onchange="applyFilters()">

          </select>
        </div>

        <div class="stat-card">
          <span>Itens</span>
          <strong id="contractItemCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Valor total estimado</span>
          <strong id="contractTotal">R$ 0,00</strong>
        </div>
      </div>
