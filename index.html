<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace CBMDF</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">CB</div>
        <div class="brand-title">
          <strong>Marketplace CBMDF</strong>
          <span>Aquisições e Serviços</span>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="pedidos.html">Excluir Pedidos</a>
        <a class="btn btn-secondary" href="status.html">Gerir Pedidos</a>
        <a class="btn btn-secondary" href="contratacoes.html">Contratações</a>
        <a class="btn btn-secondary" href="planejamento.html">Planejamento</a>
        <a class="btn btn-secondary" href="acompanhe.html">Acompanhe seu pedido</a>
      </div>
      <div class="account">
        <select id="userSelect" onchange="renderUser()"></select>
        <span id="userSector">Lotação</span>
        <button class="menu-button" id="menuButton" onclick="toggleMenu()" aria-label="Menu">☰</button>
        <div class="menu-dropdown" id="menuDropdown">
            <button type="button" onclick="window.location.href='pedidos.html'">Ver Pedidos Realizados</button>
          <button type="button" onclick="window.location.href='contratacoes.html'">Gerir Contratações</button>
          <button type="button" onclick="exportOrdersCsv()">Extrair Pedidos</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid-12">
      <article class="panel" id="search">
        <h2>Catálogo de materiais</h2>
        <div class="filter-row">
          <div class="input-group">
            <label for="searchBox">Buscar produto</label>
            <input id="searchBox" type="text" placeholder="Ex: caneta, papel, toner" oninput="applyFilters()">
          </div>
          <div class="input-group">
            <label for="categorySelect">Categoria</label>
            <select id="categorySelect" onchange="applyFilters()">
              <option value="all">Todas</option>
              <option value="escritorio">Escritório</option>
              <option value="manutencao">Manutenção</option>
              <option value="higiene">Higiene</option>
              <option value="seguranca">Segurança</option>
              <option value="saude">Saúde</option>
            </select>
          </div>
        </div>

        <div class="grid-products" id="products"></div>
      </article>

      <aside class="panel cart">
        <div>
          <h2>Seu pedido</h2>
          <!-- <p class="hint">Inclua os itens necessários e envie a requisição quando estiver pronta. A lista de materiais será registrada para análise.</p> -->
        </div>

        <div id="cartItems"></div>

        <div class="summary" id="cart-summary">
          <div class="summary-row">
            <span>Itens</span>
            <strong id="summaryCount">0</strong>
          </div>
          <div class="summary-row">
            <span>Quantidade total</span>
            <strong id="summaryQuantity">0</strong>
          </div>
          <div class="summary-row summary-total">
            <span>Total estimado</span>
            <strong id="summaryTotal">R$ 0,00</strong>
          </div>
          <div class="input-group">
            <label for="notes">Observações</label>
            <textarea id="notes" rows="3" placeholder="Ex: Do material, indicar uso específico ou unidade solicitante"></textarea>
          </div>
          <button class="btn btn-primary" onclick="submitOrder()">Enviar requisição</button>
        </div>
      </aside>
    </div>
  </main>
  <script src="src/js/script.js"></script>
</body>
</html>
