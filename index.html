<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace CBMDF</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">CB</div>
        <div class="brand-title">
          <strong>Marketplace CBMDF</strong>
          <span>Aquisições e Serviços</span>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="acompanhe.html" data-profiles="solicitante">Meus pedidos</a>
        <a class="btn btn-secondary" href="status.html" data-profiles="gestor compras">Gestão de demandas</a>
        <a class="btn btn-secondary" href="contratacoes.html" data-profiles="compras">Contratações</a>
        <a class="btn btn-secondary" href="planejamento.html" data-profiles="compras">Planejamento</a>
        <a class="btn btn-secondary" href="orcamento-geral.html" data-profiles="gestor compras">Orçamento</a>
      </div>
      <div class="account">
        <span id="userGreeting" class="account-greeting"></span>
        <select id="userSelect" onchange="renderUser()"></select>
        <span id="userSector" class="account-lotacao">Lotação</span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel personalization" id="personalization" data-profiles="solicitante">
      <div class="personalization-grid">
        <div>
          <h2>Itens mais solicitados pela sua unidade</h2>
          <div class="chip-list" id="topItemsList"></div>
        </div>
        <div>
          <h2>Últimas solicitações</h2>
          <div id="recentOrdersList"></div>
        </div>
      </div>
    </section>

    <div class="grid-12">
      <article class="panel" id="search">
        <h2>Catálogo de materiais</h2>
        <div class="filter-row">
          <div class="input-group">
            <label for="searchBox">Buscar produto</label>
            <input id="searchBox" type="text" placeholder="Ex: caneta, papel, toner" oninput="applyFilters()">
          </div>
          <div class="input-group">
            <label for="categorySelect">Categoria</label>
            <select id="categorySelect" onchange="applyFilters()">
              <option value="all">Todas</option>
              <option value="escritorio">Escritório</option>
              <option value="manutencao">Manutenção</option>
              <option value="higiene">Higiene</option>
              <option value="seguranca">Segurança</option>
              <option value="saude">Saúde</option>
            </select>
          </div>
        </div>

        <div class="grid-products" id="products"></div>
      </article>

      <aside class="panel cart">
        <div>
          <h2>Seu pedido</h2>
          <!-- <p class="hint">Inclua os itens necessários e envie a requisição quando estiver pronta. A lista de materiais será registrada para análise.</p> -->
        </div>

        <div id="cartItems"></div>

        <div class="summary" id="cart-summary">
          <div class="summary-row">
            <span>Itens</span>
            <strong id="summaryCount">0</strong>
          </div>
          <div class="summary-row">
            <span>Quantidade total</span>
            <strong id="summaryQuantity">0</strong>
          </div>
          <div class="summary-row summary-total">
            <span>Total estimado</span>
            <strong id="summaryTotal">R$ 0,00</strong>
          </div>
          <div class="input-group">
            <label for="notes">Observações</label>
            <textarea id="notes" rows="3" placeholder="Ex: Do material, indicar uso específico ou unidade solicitante"></textarea>
          </div>
          <button class="btn btn-primary" onclick="submitOrder()">Enviar requisição</button>
        </div>
      </aside>
    </div>
  </main>
  <script src="src/js/cbmdf_orders_seed.js"></script>
  <script src="src/js/users.js"></script>
  <script src="src/js/nav.js"></script>
  <script src="src/js/script.js"></script>
</body>
</html>
